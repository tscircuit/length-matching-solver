" data-label="" points="312.5766521165664,353.054369085838 309.95353646626563,345.18502213493633" fill="none" stroke="hsl(320, 100%, 50%)" stroke-width="16.8"/></g><g><polyline data-points="-8.089700567265485,3.2751337309380686 -8.128735026347337,3.3297819736526635" data-type="line" data-label="" points="309.95353646626563,345.18502213493633 305.5816770490982,339.0644189509017" fill="none" stroke="hsl(320, 100%, 50%)" stroke-width="16.8"/></g><g><polyline data-points="-8.128735026347337,3.3297819736526635 -8.183383269061931,3.3688164327345174" data-type="line" data-label="" points="305.5816770490982,339.0644189509017 299.4610738650638,334.6925595337341" fill="none" stroke="hsl(320, 100%, 50%)" stroke-width="16.8"/></g><g><polyline data-points="-8.183383269061931,3.3688164327345174 -8.25364529540927,3.392237108183629" data-type="line" data-label="" points="299.4610738650638,334.6925595337341 291.5917269141619,332.06944388343356" fill="none" stroke="hsl(320, 100%, 50%)" stroke-width="16.8"/></g><g><polyline data-points="-8.25364529540927,3.392237108183629 -8.339521105389347,3.400044" data-type="line" data-label="" points="291.5917269141619,332.06944388343356 281.97363619639316,331.19507200000004" fill="none" stroke="hsl(320, 100%, 50%)" stroke-width="16.8"/></g><g><polyline data-points="-8.339521105389347,3.400044 -8.666956,3.400044" data-type="line" data-label="" points="281.97363619639316,331.19507200000004 245.30092799999989,331.19507200000004" fill="none" stroke="hsl(320, 100%, 50%)" stroke-width="16.8"/></g><g><polyline data-points="-8.666956,3.400044 -9.067184,3" data-type="line" data-label="" points="245.30092799999989,331.19507200000004 200.47539200000006,376" fill="none" stroke="hsl(320, 100%, 50%)" stroke-width="16.8"/></g><g><rect data-type="rect" data-label="" data-x="-8" data-y="3.5" x="96" y="40" width="448" height="560" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.55)" stroke-width="0.008928571428571428"/></g><g><rect data-type="rect" data-label="" data-x="-6.99999" data-y="3.800094" x="387.2012095999999" y="275.18949440000006" width="89.59982079999997" height="22.399955199999965" fill="rgba(255,0,0,0.25)" stroke="rgba(255,0,0,0.5)" stroke-width="0.008928571428571428"/></g><g><rect data-type="rect" data-label="" data-x="-6.99999" data-y="3.400044" x="387.2012095999999" y="319.9950944000001" width="89.59982079999997" height="22.399955199999965" fill="rgba(255,0,0,0.25)" stroke="rgba(255,0,0,0.5)" stroke-width="0.008928571428571428"/></g><g><rect data-type="rect" data-label="" data-x="-9.067184" data-y="4.6" x="168.79854400000016" y="166.55977600000008" width="63.353695999999786" height="60.48044799999997" fill="rgba(255,0,0,0.25)" stroke="rgba(255,0,0,0.5)" stroke-width="0.008928571428571428"/></g><g><rect data-type="rect" data-label="" data-x="-9.067184" data-y="3" x="168.79854400000016" y="345.759776" width="63.353695999999786" height="60.480448000000024" fill="rgba(255,0,0,0.25)" stroke="rgba(255,0,0,0.5)" stroke-width="0.008928571428571428"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":112,"c":0,"e":1216,"b":0,"d":-112,"f":712};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>