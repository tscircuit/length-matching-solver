"497.3333333333333,338.66666666666663 534.6666666666667,338.66666666666663" fill="none" stroke="#1d4ed8" stroke-width="2.8000000000000003"/></g><g><rect data-type="rect" data-label="" data-x="13" data-y="0.5" x="40" y="217.33333333333334" width="560" height="205.33333333333331" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.55)" stroke-width="0.05357142857142857"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="66.13333333333331" y="301.3333333333333" width="22.400000000000006" height="56" fill="rgba(255,0,0,0.25)" stroke="rgba(255,0,0,0.5)" stroke-width="0.05357142857142857"/></g><g><rect data-type="rect" data-label="" data-x="10" data-y="0" x="252.8" y="310.66666666666663" width="22.399999999999977" height="37.33333333333337" fill="rgba(255,0,0,0.25)" stroke="rgba(255,0,0,0.5)" stroke-width="0.05357142857142857"/></g><g><rect data-type="rect" data-label="" data-x="26" data-y="0" x="542.1333333333334" y="292" width="41.06666666666672" height="74.66666666666663" fill="rgba(255,0,0,0.25)" stroke="rgba(255,0,0,0.5)" stroke-width="0.05357142857142857"/></g><circle data-type="circle" data-label="" data-x="4" data-y="3.5" cx="152" cy="264" r="7.466666666666668" fill="#fef3c7" stroke="#c2410c" stroke-width="0.05357142857142857"/><text data-type="text" data-label="USB pair: J1 → ESD → MCU" data-x="13" data-y="5.2" x="320" y="232.26666666666665" fill="black" font-size="14.933333333333335" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">USB pair: J1 → ESD → MCU</text><text data-type="text" data-label="J1 / USB" data-x="0" data-y="2.5" x="77.33333333333331" y="282.66666666666663" fill="black" font-size="11.200000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">J1 / USB</text><text data-type="text" data-label="U1 / ESD" data-x="10" data-y="2.5" x="264" y="282.66666666666663" fill="black" font-size="11.200000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U1 / ESD</text><text data-type="text" data-label="U2 / MCU" data-x="26" data-y="3" x="562.6666666666667" y="273.3333333333333" fill="black" font-size="11.200000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">U2 / MCU</text><text data-type="text" data-label="TP1 / ignored tap" data-x="4" data-y="4.2" x="152" y="250.9333333333333" fill="black" font-size="10.266666666666667" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TP1 / ignored tap</text><text data-type="text" data-label="P_AB" data-x="6.5" data-y="1.3" x="198.66666666666666" y="305.06666666666666" fill="#c2410c" font-size="11.200000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">P_AB</text><text data-type="text" data-label="N_AB" data-x="5.5" data-y="-1.5" x="180" y="357.3333333333333" fill="#1d4ed8" font-size="11.200000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">N_AB</text><text data-type="text" data-label="P_BC" data-x="17" data-y="2" x="394.6666666666667" y="292" fill="#c2410c" font-size="11.200000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">P_BC</text><text data-type="text" data-label="N_BC" data-x="17" data-y="-3" x="394.6666666666667" y="385.3333333333333" fill="#1d4ed8" font-size="11.200000000000001" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">N_BC</text><text data-type="text" data-label="N takes a longer path; tune P without counting TP1" data-x="13" data-y="-4.3" x="320" y="409.59999999999997" fill="black" font-size="10.266666666666667" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">N takes a longer path; tune P without counting TP1</text><g><circle data-type="point" data-label="" data-x="11" data-y="0.5" cx="282.66666666666663" cy="320" r="3" fill="#475569"/></g><g><circle data-type="point" data-label="" data-x="24.5" data-y="0.5" cx="534.6666666666667" cy="320" r="3" fill="#475569"/></g><g><circle data-type="point" data-label="" data-x="4" data-y="0.5" cx="152" cy="320" r="3" fill="#475569"/></g><g><circle data-type="point" data-label="" data-x="4" data-y="3.5" cx="152" cy="264" r="3" fill="#475569"/></g><g><circle data-type="point" data-label="" data-x="1" data-y="-0.5" cx="95.99999999999999" cy="338.66666666666663" r="3" fill="#475569"/></g><g><circle data-type="point" data-label="" data-x="9" data-y="-0.5" cx="245.33333333333331" cy="338.66666666666663" r="3" fill="#475569"/></g><g><circle data-type="point" data-label="" data-x="1" data-y="0.5" cx="95.99999999999999" cy="320" r="3" fill="#475569"/></g><g><circle data-type="point" data-label="" data-x="9" data-y="0.5" cx="245.33333333333331" cy="320" r="3" fill="#475569"/></g><g><circle data-type="point" data-label="" data-x="11" data-y="-0.5" cx="282.66666666666663" cy="338.66666666666663" r="3" fill="#475569"/></g><g><circle data-type="point" data-label="" data-x="24.5" data-y="-0.5" cx="534.6666666666667" cy="338.66666666666663" r="3" fill="#475569"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":18.666666666666668,"c":0,"e":77.33333333333331,"b":0,"d":-18.666666666666668,"f":329.3333333333333};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>