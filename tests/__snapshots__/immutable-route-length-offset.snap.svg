1.68566222575544,249.2261246105061" fill="none" stroke="hsl(60, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><polyline data-points="5.994386825459919,1.2638192033838196 5.999999999999999,1.2020742834429257" data-type="line" data-label="" points="431.68566222575544,249.2261246105061 431.99999999999994,252.68384012719616" fill="none" stroke="hsl(60, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><polyline data-points="5.999999999999999,1.2020742834429257 6.005613174540082,1.1403293635020317" data-type="line" data-label="" points="431.99999999999994,252.68384012719616 432.3143377742446,256.14155564388625" fill="none" stroke="hsl(60, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><polyline data-points="6.005613174540082,1.1403293635020317 6.0224526981603255,1.0898107926413005" data-type="line" data-label="" points="432.3143377742446,256.14155564388625 433.25735109697825,258.97059561208715" fill="none" stroke="hsl(60, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><polyline data-points="6.0224526981603255,1.0898107926413005 6.0505185708607305,1.0505185708607314" data-type="line" data-label="" points="433.25735109697825,258.97059561208715 434.8290399682009,261.17096003179904" fill="none" stroke="hsl(60, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><polyline data-points="6.0505185708607305,1.0505185708607314 6.0898107926413,1.022452698160325" data-type="line" data-label="" points="434.8290399682009,261.17096003179904 437.0294043879128,262.7426489030218" fill="none" stroke="hsl(60, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><polyline data-points="6.0898107926413,1.022452698160325 6.1403293635020315,1.0056131745400814" data-type="line" data-label="" points="437.0294043879128,262.7426489030218 439.85844435611375,263.68566222575544" fill="none" stroke="hsl(60, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><polyline data-points="6.1403293635020315,1.0056131745400814 6.202074283442925,1" data-type="line" data-label="" points="439.85844435611375,263.68566222575544 443.3161598728038,264" fill="none" stroke="hsl(60, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><polyline data-points="6.202074283442925,1 8,1" data-type="line" data-label="" points="443.3161598728038,264 544,264" fill="none" stroke="hsl(60, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><polyline data-points="0,-1 7,-1" data-type="line" data-label="" points="96,376 488,376" fill="none" stroke="hsl(0, 100%, 50%)" stroke-linejoin="round" stroke-width="5.6000000000000005"/></g><g><rect data-type="rect" data-label="" data-x="4" data-y="0" x="40" y="40" width="560" height="560" fill="rgba(30,41,59,0.03)" stroke="rgba(30,41,59,0.55)" stroke-width="0.017857142857142856"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56,"c":0,"e":96,"b":0,"d":-56,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>