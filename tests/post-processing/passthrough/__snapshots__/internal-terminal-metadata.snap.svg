<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-23.755,-6.66 -22.795,-7.67" data-type="line" data-label="" points="161.0884353741494,200.27210884353735 422.3129251700675,475.1020408163265" fill="none" stroke="#2563eb" stroke-width="27.210884353741502" stroke-dasharray="0.2 0.16"/></g><g><polyline data-points="-22.795,-7.67 -22.776,-7.4" data-type="line" data-label="" points="422.3129251700675,475.1020408163265 427.48299319727903,401.6326530612246" fill="none" stroke="#2563eb" stroke-width="27.210884353741502" stroke-dasharray="0.2 0.16"/></g><g><polyline data-points="-22.776,-7.4 -22.776,-7.4" data-type="line" data-label="" points="427.48299319727903,401.6326530612246 427.48299319727903,401.6326530612246" fill="none" stroke="#2563eb" stroke-width="27.210884353741502"/></g><g><rect data-type="rect" data-label="" data-x="-23.2" data-y="-7.1" x="40" y="47.89115646258506" width="544.2176870748299" height="544.2176870748299" fill="rgba(30, 70, 120, 0.04)" stroke="rgba(30, 70, 120, 0.55)" stroke-width="0.0036749999999999994"/></g><g><rect data-type="rect" data-label="" data-x="-23.755" data-y="-6.66" x="93.06122448979568" y="132.24489795918362" width="136.05442176870747" height="136.05442176870747" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.0036749999999999994"/></g><g><rect data-type="rect" data-label="" data-x="-22.795" data-y="-7.67" x="354.28571428571377" y="407.0748299319728" width="136.05442176870747" height="136.05442176870747" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.0036749999999999994"/></g><g><rect data-type="rect" data-label="" data-x="-22.776" data-y="-7.4" x="359.4557823129253" y="333.6054421768707" width="136.05442176870747" height="136.0544217687077" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.0036749999999999994"/></g><circle data-type="circle" data-label="" data-x="-22.776" data-y="-7.4" cx="427.48299319727903" cy="401.6326530612246" r="40.81632653061225" fill="rgba(37, 99, 235, 0.45)" stroke="#2563eb" stroke-width="0.0036749999999999994"/><text data-type="text" data-label="Rejected: pass-through would not accept the internal terminal" data-x="-23.2" data-y="-6.2" x="312.10884353741494" y="75.10204081632651" fill="#111827" font-size="12.244897959183675" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">Rejected: pass-through would not accept the internal terminal</text><text data-type="text" data-label="start: pcb_port_933" data-x="-23.82" data-y="-6.4" x="143.40136054421782" y="129.52380952380963" fill="#1d4ed8" font-size="10.8843537414966" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">start: pcb_port_933</text><text data-type="text" data-label="internal branch terminal: pcb_port_873" data-x="-23.15" data-y="-7.95" x="325.71428571428623" y="551.2925170068027" fill="#1d4ed8" font-size="10.8843537414966" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">internal branch terminal: pcb_port_873</text><text data-type="text" data-label="end: pcb_port_691" data-x="-22.55" data-y="-7.15" x="488.97959183673447" y="333.60544217687084" fill="#1d4ed8" font-size="10.8843537414966" font-family="sans-serif" text-anchor="start" dominant-baseline="central">end: pcb_port_691</text><g><circle data-type="point" data-label="start pcb_port_933" data-x="-23.755" data-y="-6.66" cx="161.0884353741494" cy="200.27210884353735" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="internal branch pcb_port_873" data-x="-22.795" data-y="-7.67" cx="422.3129251700675" cy="475.1020408163265" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="end pcb_port_691" data-x="-22.776" data-y="-7.4" cx="427.48299319727903" cy="401.6326530612246" r="3" fill="#2563eb"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":272.108843537415,"c":0,"e":6625.034013605443,"b":0,"d":-272.108843537415,"f":-1611.9727891156465};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>