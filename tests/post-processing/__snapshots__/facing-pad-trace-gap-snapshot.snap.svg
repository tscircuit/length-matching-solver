line data-points="1.4741158428071237,0.39606236896328895 1.497643327082718,0.3254799161365049" data-type="line" data-label="" points="361.27524359859945,308.9102536690279 361.93401315831613,310.88656234817785" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="1.497643327082718,0.3254799161365049 1.5368558008753759,0.270582452826784" data-type="line" data-label="" points="361.93401315831613,310.88656234817785 363.03196242451054,312.42369132085" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="1.5368558008753759,0.270582452826784 1.5917532641850967,0.23136997903412626" data-type="line" data-label="" points="363.03196242451054,312.42369132085 364.5690913971827,313.5216405870445" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="1.5917532641850967,0.23136997903412626 1.6623357170118809,0.2078424947585316" data-type="line" data-label="" points="364.5690913971827,313.5216405870445 366.54540007633267,314.1804101467611" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="1.6623357170118809,0.2078424947585316 1.7486031593557279,0.2" data-type="line" data-label="" points="366.54540007633267,314.1804101467611 368.9608884619604,314.4" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="1.7486031593557279,0.2 5.1,0.2" data-type="line" data-label="" points="368.9608884619604,314.4 462.79999999999995,314.4" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="5.1,0.2 5.2,0.5" data-type="line" data-label="" points="462.79999999999995,314.4 465.6,306" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="40" y="40" width="560" height="560" fill="rgba(30, 70, 120, 0.04)" stroke="rgba(30, 70, 120, 0.55)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="-5" data-y="-0.5" x="177.20000000000002" y="331.2" width="5.599999999999966" height="5.600000000000023" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="5" data-y="-0.5" x="457.20000000000005" y="331.2" width="5.599999999999909" height="5.600000000000023" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="-4.8" data-y="0.5" x="182.8" y="303.2" width="5.599999999999994" height="5.600000000000023" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="5.2" data-y="0.5" x="462.80000000000007" y="303.2" width="5.599999999999966" height="5.600000000000023" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":28,"c":0,"e":320,"b":0,"d":-28,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
