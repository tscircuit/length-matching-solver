<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-14,0.3 -13.054979246179029,0.2" data-type="line" data-label="" points="145.77777777777777,316.26666666666665 157.53803604754987,317.5111111111111" fill="none" stroke="#2563eb" stroke-width="1.8666666666666667"/></g><g><polyline data-points="-13.054979246179029,0.2 8.15,0.2" data-type="line" data-label="" points="157.53803604754987,317.5111111111111 421.4222222222222,317.5111111111111" fill="none" stroke="#2563eb" stroke-width="1.8666666666666667"/></g><g><polyline data-points="8.15,0.2 14,0.3" data-type="line" data-label="" points="421.4222222222222,317.5111111111111 494.22222222222223,316.26666666666665" fill="none" stroke="#2563eb" stroke-width="1.8666666666666667"/></g><g><polyline data-points="-14,-0.3 -13.054979246179029,-0.2" data-type="line" data-label="" points="145.77777777777777,323.73333333333335 157.53803604754987,322.4888888888889" fill="none" stroke="#2563eb" stroke-width="1.8666666666666667"/></g><g><polyline data-points="-13.054979246179029,-0.2 8.15,-0.2" data-type="line" data-label="" points="157.53803604754987,322.4888888888889 421.4222222222222,322.4888888888889" fill="none" stroke="#2563eb" stroke-width="1.8666666666666667"/></g><g><polyline data-points="8.15,-0.2 9,-0.3" data-type="line" data-label="" points="421.4222222222222,322.4888888888889 432,323.73333333333335" fill="none" stroke="#2563eb" stroke-width="1.8666666666666667"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="40" y="170.66666666666663" width="560" height="298.66666666666674" fill="rgba(30, 70, 120, 0.04)" stroke="rgba(30, 70, 120, 0.55)" stroke-width="0.08035714285714285"/></g><g><rect data-type="rect" data-label="" data-x="-14" data-y="0.3" x="140.79999999999998" y="314.7111111111111" width="9.955555555555577" height="3.111111111111086" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.08035714285714285"/></g><g><rect data-type="rect" data-label="" data-x="14" data-y="0.3" x="489.2444444444444" y="314.7111111111111" width="9.955555555555634" height="3.111111111111086" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.08035714285714285"/></g><g><rect data-type="rect" data-label="" data-x="-14" data-y="-0.3" x="140.79999999999998" y="322.1777777777778" width="9.955555555555577" height="3.111111111111086" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.08035714285714285"/></g><g><rect data-type="rect" data-label="" data-x="9" data-y="-0.3" x="427.02222222222224" y="322.1777777777778" width="9.95555555555552" height="3.111111111111086" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.08035714285714285"/></g><text data-type="text" data-label="Copper gap 0.25 mm (requested 0.25 mm)" data-x="0" data-y="4" x="320" y="270.22222222222223" fill="black" font-size="12.444444444444445" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Copper gap 0.25 mm (requested 0.25 mm)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":12.444444444444445,"c":0,"e":320,"b":0,"d":-12.444444444444445,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
