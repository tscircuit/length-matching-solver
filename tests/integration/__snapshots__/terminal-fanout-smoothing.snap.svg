.9080119445476624,0.575" data-type="line" data-label="" points="425.8860731475951,303.5783398818419 429.42433444733456,303.9" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="3.9080119445476624,0.575 5.49,0.575" data-type="line" data-label="" points="429.42433444733456,303.9 473.72,303.9" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="5.49,0.575 5.49,2" data-type="line" data-label="" points="473.72,303.9 473.72,264" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="-6,-2 -2.4922042580511636,-0.575" data-type="line" data-label="" points="152,376 250.2182807745674,336.1" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="-2.4922042580511636,-0.575 5.49,-0.575" data-type="line" data-label="" points="250.2182807745674,336.1 473.72,336.1" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><polyline data-points="5.49,-0.575 5.49,-2" data-type="line" data-label="" points="473.72,336.1 473.72,376" fill="none" stroke="#2563eb" stroke-width="4.2"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="40" y="180" width="560" height="280" fill="rgba(30, 70, 120, 0.04)" stroke="rgba(30, 70, 120, 0.55)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="-6" data-y="-2" x="135.20000000000002" y="359.2" width="33.599999999999966" height="33.60000000000002" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="-3.49" data-y="2" x="214.72000000000003" y="255.04000000000002" width="15.119999999999976" height="17.91999999999996" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="-4.51" data-y="2" x="186.16000000000003" y="255.04000000000002" width="15.119999999999976" height="17.91999999999996" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="5.49" data-y="-2" x="466.1600000000001" y="367.04" width="15.119999999999948" height="17.91999999999996" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="6.51" data-y="-2" x="494.72" y="367.04" width="15.119999999999948" height="17.91999999999996" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="5.49" data-y="2" x="466.1600000000001" y="255.04000000000002" width="15.119999999999948" height="17.91999999999996" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g><rect data-type="rect" data-label="" data-x="6.51" data-y="2" x="494.72" y="255.04000000000002" width="15.119999999999948" height="17.91999999999996" fill="rgba(220, 60, 60, 0.16)" stroke="rgba(190, 40, 40, 0.75)" stroke-width="0.03571428571428571"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":28,"c":0,"e":320,"b":0,"d":-28,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>